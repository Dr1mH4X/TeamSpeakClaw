name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/**"
      - ".cargo/**"
      - ".dockerignore"
      - "Dockerfile"
      - "examples/config/**"
      - "proto/**"
      - "src/**"
      - "tests/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain"
      - "rust-toolchain.toml"
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - "website/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/reusable-quality.yml

  meta:
    uses: ./.github/workflows/reusable-meta.yml

  build:
    needs: [quality, meta]
    uses: ./.github/workflows/reusable-build.yml
    with:
      version: ${{ needs.meta.outputs.version }}
      is-release: false
