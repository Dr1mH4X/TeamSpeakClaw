name: Docker SHA (Manual)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      sha-tag:
        description: "要推送的 sha tag（如 sha-abc1234），留空则用当前 commit 的短 sha"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  alpine:
    uses: ./.github/workflows/reusable-build-alpine.yml
    with:
      version: ${{ format('0.0.0-dev.{0}', github.sha) }}
      is-release: false

  docker:
    needs: alpine
    uses: ./.github/workflows/reusable-docker.yml
    with:
      is-release: false
      is-stable-release: false
      sha-tag: ${{ inputs.sha-tag }}
      binary-artifact: docker-binary-Alpine-amd64
    secrets: inherit
