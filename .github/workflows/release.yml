name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  quality:
    name: Rust quality gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libopus-dev

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test --all-targets --locked

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  meta:
    uses: ./.github/workflows/reusable-meta.yml

  build:
    needs: [quality, meta]
    uses: ./.github/workflows/reusable-build.yml
    with:
      version: ${{ needs.meta.outputs.version }}
      is-release: true

  docker:
    needs: [quality, meta]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-docker.yml
    with:
      version: ${{ needs.meta.outputs.version }}
      is-release: true
      is-stable-release: ${{ needs.meta.outputs.is-stable-release == 'true' }}
    secrets: inherit

  changelog:
    needs: meta
    uses: ./.github/workflows/reusable-changelog.yml

  release:
    name: Create Release
    needs: [quality, meta, build, changelog, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: artifacts-*
          merge-multiple: true

      - name: List artifacts
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: Release ${{ needs.meta.outputs.tag }}
          body: |
            ${{ needs.changelog.outputs.release_body }}
          draft: false
          prerelease: ${{ needs.meta.outputs.is-prerelease == 'true' }}
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
