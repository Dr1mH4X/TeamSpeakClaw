name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  quality:
    name: Rust quality gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libopus-dev

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test --all-targets --locked

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  meta:
    uses: ./.github/workflows/reusable-meta.yml

  build:
    needs: [quality, meta]
    uses: ./.github/workflows/reusable-build.yml
    with:
      version: ${{ needs.meta.outputs.version }}
      is-release: true

  docker:
    needs: [quality, meta]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-docker.yml
    with:
      version: ${{ needs.meta.outputs.version }}
      is-release: true
      is-stable-release: ${{ needs.meta.outputs.is-stable-release == 'true' }}
    secrets: inherit

  release:
    name: Create Release
    needs: [quality, meta, build, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Locate the release log
        id: release-log
        run: |
          tag="${{ needs.meta.outputs.tag }}"
          version="${tag#v}"
          path="docs/release/$tag.md"
          if [ ! -f "$path" ]; then
            echo "::error::missing release log $path; write it in the release PR per docs/release/AGENTS.md"
            exit 1
          fi
          heading="$(head -n 1 "$path")"
          if ! printf '%s\n' "$heading" | grep -Eq "^# ${version} \([0-9]{4}-[0-9]{2}-[0-9]{2}\): [^[:space:]].*$"; then
            echo "::error::$path must open with '# $version (<date>): <summary>'; see docs/release/AGENTS.md"
            exit 1
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          pattern: artifacts-*
          merge-multiple: true

      - name: List artifacts
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: Release ${{ needs.meta.outputs.tag }}
          body_path: ${{ steps.release-log.outputs.path }}
          draft: false
          prerelease: ${{ needs.meta.outputs.is-prerelease == 'true' }}
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
