# TeamSpeakClaw ACL（访问控制列表）配置
# 复制此文件到 config/acl.toml 并根据需要修改规则
#
# 规则匹配逻辑：
#   1. server_group_ids 和 channel_group_ids 需要「同时匹配」才算匹配
#   2. 若某一侧数组为空（[]），表示对该侧不做限制，等价于"匹配所有该侧的用户"
#   3. 当用户同时命中多条规则时，allowed_skills 会从所有匹配规则中合并（取并集）
#   4. 如果任一匹配规则包含 "*"，则允许所有技能
#
# 服务器组 ID（TS3 默认布局，可在客户端右键查看服务器组，或按 sgid 核对）：
#   - 6: Server Admin  服务器管理员
#   - 7: Normal        普通用户
#   - 8: Guest         访客
# 频道组是另一套编号（「频道管理员」是 5），不要和服务器组混用。
#
# NapCat 虚拟组 ID 映射：
#   - 9000: 任意 NapCat 用户
#   - 9001: NapCat 群聊上下文
#   - 9002: trusted_users 中的用户
#   - 9003: trusted_groups 中群成员
#
# 可用技能名称：
#   - poke_client: 戳一戳用户
#   - send_message: 发送消息（跨平台路由）
#   - kick_client: 踢出用户
#   - ban_client: 封禁用户
#   - move_client: 移动用户到指定频道
#   - get_client_info: 获取用户详细信息
#   - music_control: 音乐控制
#   - web_search: 搜索最新网络信息
#   - voice_replay: 回放最近语音窗口

# 6 Server Admin：全部技能，并可对受保护组的成员执行踢出/封禁
[[rules]]
server_group_ids = [6]
channel_group_ids = []
allowed_skills = ["*"]
can_target_admins = true

# 7 Normal：常用技能；不能对受保护组的成员执行踢出/封禁
[[rules]]
server_group_ids = [7]
channel_group_ids = []
allowed_skills = [
  "poke_client",
  "send_message",
  "get_client_info",
  "music_control",
  "voice_replay"
]
can_target_admins = false

# 8 Guest：只保留聊天、查询与点歌
[[rules]]
server_group_ids = [8]
channel_group_ids = []
allowed_skills = [
  "send_message",
  "get_client_info",
  "music_control"
]
can_target_admins = false

# 频道管理员：只看频道组（服务器组留空表示不限制）
[[rules]]
server_group_ids = []
channel_group_ids = [5]
allowed_skills = [
  "poke_client",
  "send_message",
  "get_client_info",
  "music_control",
  "kick_client",
  "voice_replay"
]
can_target_admins = false

# NapCat 映射规则（可按需启用）
[[rules]]
server_group_ids = [9000]  # 任意 NapCat 用户
channel_group_ids = []
allowed_skills = [
  "send_message",
  "get_client_info",
  "music_control"
]
can_target_admins = false

# 默认规则（匹配所有人）：以上规则都没命中时的兜底
[[rules]]
server_group_ids = []
channel_group_ids = []
allowed_skills = ["music_control"]
can_target_admins = false

# 受保护的组 ID：can_target_admins = false 的用户不能对这些组的成员执行踢出/封禁等操作
[acl]
protected_group_ids = [6, 7, 8]